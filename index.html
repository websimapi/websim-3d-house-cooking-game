<html><head><base href="https://game.example.com/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House First Person Game</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  touch-action: none;
  font-family: Arial, sans-serif;
}

#game-container {
  position: fixed;
  width: 100%;
  height: 100%;
}

#mobile-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 20px;
  z-index: 100;
}

.control-btn {
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.3);
  border: 2px solid white;
  border-radius: 50%;
  color: white;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  user-select: none;
}

#interaction-prompt {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px 20px;
  border-radius: 5px;
  display: none;
  z-index: 100;
}

#start-prompt {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  z-index: 101;
}
</style>
</head>
<body>
<div id="game-container"></div>
<div id="mobile-controls">
  <div class="control-btn" id="forward">↑</div>
  <div class="control-btn" id="left">←</div>
  <div class="control-btn" id="right">→</div>
  <div class="control-btn" id="backward">↓</div>
</div>
<div id="interaction-prompt">Tap to interact with door</div>
<div id="start-prompt">Click/Tap anywhere to start exploring!</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

let scene, camera, renderer, controls;
let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;
let canInteract = false;
let door;
let playerVelocity = new THREE.Vector3();
let direction = new THREE.Vector3();
let prevTime = performance.now();

function init() {
  try {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 5);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('game-container').appendChild(renderer.domElement);
    
    controls = new PointerLockControls(camera, document.body);
    
    const light = new THREE.AmbientLight(0x404040);
    scene.add(light);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 5, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
    
    createScene();
    setupEventListeners();
    animate();
  } catch (error) {
    console.error('Initialization error:', error);
  }
}

function createScene() {
  // Ground
  const groundGeometry = new THREE.PlaneGeometry(100, 100);
  const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x808080 });
  const ground = new THREE.Mesh(groundGeometry, groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  // House
  const houseGeometry = new THREE.BoxGeometry(15, 8, 15);
  const houseMaterial = new THREE.MeshPhongMaterial({ color: 0xcccccc });
  const house = new THREE.Mesh(houseGeometry, houseMaterial);
  house.position.y = 4;
  house.receiveShadow = true;
  scene.add(house);
  
  // Roof
  const roofGeometry = new THREE.ConeGeometry(12, 6, 4);
  const roofMaterial = new THREE.MeshPhongMaterial({ color: 0x8b4513 });
  const roof = new THREE.Mesh(roofGeometry, roofMaterial);
  roof.position.y = 11;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  scene.add(roof);
  
  // Door
  const doorGeometry = new THREE.BoxGeometry(2, 4, 0.2);
  const doorMaterial = new THREE.MeshPhongMaterial({ color: 0x8b4513 });
  door = new THREE.Mesh(doorGeometry, doorMaterial);
  door.position.set(0, 2, 7.4);
  door.castShadow = true;
  scene.add(door);
}

function setupEventListeners() {
  document.addEventListener('click', function() {
    controls.lock();
    document.getElementById('start-prompt').style.display = 'none';
  });
  
  controls.addEventListener('lock', function() {
    document.getElementById('mobile-controls').style.display = 'flex';
  });
  
  controls.addEventListener('unlock', function() {
    document.getElementById('mobile-controls').style.display = 'none';
  });
  
  // Mobile controls
  document.getElementById('forward').addEventListener('touchstart', () => moveForward = true);
  document.getElementById('forward').addEventListener('touchend', () => moveForward = false);
  document.getElementById('backward').addEventListener('touchstart', () => moveBackward = true);
  document.getElementById('backward').addEventListener('touchend', () => moveBackward = false);
  document.getElementById('left').addEventListener('touchstart', () => moveLeft = true);
  document.getElementById('left').addEventListener('touchend', () => moveLeft = false);
  document.getElementById('right').addEventListener('touchstart', () => moveRight = true);
  document.getElementById('right').addEventListener('touchend', () => moveRight = false);
  
  // Desktop controls
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  
  // Interaction
  document.addEventListener('mousedown', onInteract);
  document.addEventListener('touchstart', onInteract);
  
  window.addEventListener('resize', onWindowResize, false);
}

function onKeyDown(event) {
  switch (event.code) {
    case 'ArrowUp':
    case 'KeyW':
      moveForward = true;
      break;
    case 'ArrowDown':
    case 'KeyS':
      moveBackward = true;
      break;
    case 'ArrowLeft':
    case 'KeyA':
      moveLeft = true;
      break;
    case 'ArrowRight':
    case 'KeyD':
      moveRight = true;
      break;
  }
}

function onKeyUp(event) {
  switch (event.code) {
    case 'ArrowUp':
    case 'KeyW':
      moveForward = false;
      break;
    case 'ArrowDown':
    case 'KeyS':
      moveBackward = false;
      break;
    case 'ArrowLeft':
    case 'KeyA':
      moveLeft = false;
      break;
    case 'ArrowRight':
    case 'KeyD':
      moveRight = false;
      break;
  }
}

function onInteract() {
  if (canInteract) {
    try {
      door.rotation.y = door.rotation.y === 0 ? Math.PI / 2 : 0;
    } catch (error) {
      console.error('Door interaction error:', error);
    }
  }
}

function checkDoorProximity() {
  try {
    const doorPosition = new THREE.Vector3();
    door.getWorldPosition(doorPosition);
    const distance = camera.position.distanceTo(doorPosition);
    
    if (distance < 3) {
      canInteract = true;
      document.getElementById('interaction-prompt').style.display = 'block';
    } else {
      canInteract = false;
      document.getElementById('interaction-prompt').style.display = 'none';
    }
  } catch (error) {
    console.error('Door proximity check error:', error);
  }
}

function onWindowResize() {
  try {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  } catch (error) {
    console.error('Window resize error:', error);
  }
}

function animate() {
  try {
    requestAnimationFrame(animate);
    
    if (controls.isLocked) {
      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      
      playerVelocity.x = 0;
      playerVelocity.z = 0;
      
      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize();
      
      if (moveForward || moveBackward) {
        playerVelocity.z -= direction.z * 5.0 * delta;
      }
      if (moveLeft || moveRight) {
        playerVelocity.x -= direction.x * 5.0 * delta;
      }
      
      controls.moveRight(-playerVelocity.x);
      controls.moveForward(-playerVelocity.z);
      
      checkDoorProximity();
      
      prevTime = time;
    }
    
    renderer.render(scene, camera);
  } catch (error) {
    console.error('Animation error:', error);
  }
}

window.addEventListener('load', () => {
  try {
    init();
  } catch (error) {
    console.error('Game initialization error:', error);
  }
});

window.addEventListener('unhandledrejection', event => {
  console.error('Unhandled promise rejection:', event.reason);
});
</script>
